<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Matéria | SCTV (restrito)</title>
  <meta name="description" content="Editor restrito SCTV: criar matéria com SEO, capa e publicação." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0F172A" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet" /></noscript>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/webp" href="assets/img/logo-sctv.webp" />
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/pages.css" />
  <style>
    .editor-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;margin:16px auto;align-items:start}
    .preview{position:sticky;top:150px}
    .preview__cover{width:100%;height:auto;aspect-ratio:1200/675;object-fit:cover;border-radius:10px;background:#020617}
    .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
    .btn-draft{background:#0B1226;color:#fff;border:1px solid var(--gold)}
    .char-count{font-size:.72rem;color:var(--muted);text-align:right}
    @media(max-width:1024px){.editor-grid{grid-template-columns:1fr}.preview{position:static}}
  </style>
</head>
<body>
  <a class="skip-link" href="#formMateria">Pular para o editor</a>
  <div class="topbar" role="complementary" aria-label="Barra utilitária">
    <div class="container topbar__inner">
      <div class="topbar__left">
        <span class="topbar__datetime"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Z"/></svg><time id="currentDateTime">Carregando data...</time></span>
      </div>
      <div class="topbar__right"><button class="btn-out" id="btnSair" type="button" style="background:#0B1226;color:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:800;cursor:pointer">Sair ⏻</button></div>
    </div>
  </div>

  <header class="site-header" id="siteHeader">
    <div class="container header__inner">
      <a href="/" class="brand" aria-label="SCTV - Início">
        <img src="assets/img/logo-sctv.webp" alt="SCTV" class="brand__logo" width="180" height="72" decoding="async" onerror="this.style.display='none'" />
      </a>
    </div>
  </header>

  <main id="conteudo" class="container">
    <div class="page-hero" style="margin-top:18px">
      <span class="page-hero__kicker">✍️ Editor restrito • SEO premium</span>
      <h1>Nova matéria</h1>
      <p id="autorLine">Verificando permissão...</p>
    </div>

    <div class="editor-grid">
      <section class="form-card" aria-labelledby="edTitle">
        <h2 id="edTitle">📝 Conteúdo</h2>
        <form id="formMateria" novalidate>
          <div class="form-row">
            <div class="field"><label for="f-cat">Editoria *</label>
              <select id="f-cat" required>
                <option value="">Selecione...</option>
                <option value="brasil">Brasil</option>
                <option value="mundo">Mundo</option>
                <option value="politica">Política</option>
                <option value="economia">Economia</option>
                <option value="agro">Agro &amp; Negócios</option>
                <option value="esportes">Esportes</option>
                <option value="entretenimento">Entretenimento</option>
                <option value="policial">Policial</option>
                <option value="cujubim">Cujubim / RO</option>
              </select><span class="err" aria-live="polite"></span></div>
            <div class="field"><label for="f-slug">Slug (URL) *</label><input id="f-slug" type="text" placeholder="ex: recorde-na-safra" required /><span class="err" aria-live="polite"></span></div>
          </div>
          <div class="field"><label for="f-titulo">Título H1 (gatilho + Cujubim/RO quando regional) *</label><input id="f-titulo" type="text" maxlength="120" placeholder="Título de alto impacto" required /><span class="char-count" id="cTitulo">0/120</span><span class="err" aria-live="polite"></span></div>
          <div class="field"><label for="f-dek">Linha fina (subtítulo SEO) *</label><textarea id="f-dek" rows="2" maxlength="220" placeholder="Resumo persuasivo em 1-2 frases"></textarea><span class="char-count" id="cDek">0/220</span><span class="err" aria-live="polite"></span></div>
          <div class="field"><label for="f-capa-file">Foto de capa (upload 1200×675)</label><input id="f-capa-file" type="file" accept="image/*" /><span class="err" aria-live="polite"></span></div>
          <div class="field"><label for="f-capa-url">...ou URL da imagem HD</label><input id="f-capa-url" type="url" placeholder="https://..." /><span class="err" aria-live="polite"></span></div>
          <div class="field"><label for="f-credito">Legenda / crédito da foto</label><input id="f-credito" type="text" placeholder="Foto: Redação SCTV" /></div>
          <div class="field"><label for="f-corpo">Corpo da matéria (parágrafos separados por linha em branco) *</label><textarea id="f-corpo" rows="12" placeholder="Lead com o essencial nos 10 primeiros segundos..."></textarea><span class="err" aria-live="polite"></span></div>
          <div class="form-row">
            <div class="field"><label for="f-tags">Tags (vírgula)</label><input id="f-tags" type="text" placeholder="Cujubim, Rondônia, SCTV" /></div>
            <div class="field"><label for="f-kw">news_keywords</label><input id="f-kw" type="text" placeholder="Cujubim, Rondônia, Porto Velho" /></div>
          </div>
          <div class="btn-row">
            <button class="btn-submit btn-draft" type="button" id="btnRascunho">💾 Salvar rascunho</button>
            <button class="btn-submit" type="button" id="btnPublicar">🚀 Publicar agora</button>
          </div>
          <div class="form-ok" id="edOk" hidden role="status"></div>
        </form>
      </section>

      <aside class="form-card preview" aria-label="Pré-visualização">
        <h2>👁️ Pré-visualização</h2>
        <img id="prevCover" class="preview__cover" alt="Prévia da capa" width="1200" height="675" />
        <h3 id="prevTitle" style="margin:10px 0 6px">Seu título aparece aqui</h3>
        <p id="prevDek" style="font-size:.85rem;color:#CBD5E1">Linha fina...</p>
        <div id="prevBody" style="font-size:.85rem;color:#E2E8F0;margin-top:8px"></div>
      </aside>
    </div>
  </main>

  <script src="assets/js/main.js" defer></script>
  <script type="module">
    import { supabase } from './assets/js/supabaseClient.js';
    import { requireAuth } from './assets/js/guard.js';

    const me = await requireAuth('correspondente');
    const { data: { session } } = await supabase.auth.getSession();
    const autorId = session.user.id;
    document.getElementById('autorLine').innerHTML = `Publicando como <strong>${me.nome}</strong> (${me.role}).`;

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[<>&"]/g, (m) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[m]));
    const slugify = (s) => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 80);

    // Slug automático a partir do título (editável)
    let slugManual = false;
    $('f-titulo').addEventListener('input', (e) => {
      $('cTitulo').textContent = `${e.target.value.length}/120`;
      $('prevTitle').textContent = e.target.value || 'Seu título aparece aqui';
      if (!slugManual) $('f-slug').value = slugify(e.target.value);
    });
    $('f-slug').addEventListener('input', () => { slugManual = true; });
    $('f-dek').addEventListener('input', (e) => {
      $('cDek').textContent = `${e.target.value.length}/220`;
      $('prevDek').textContent = e.target.value || 'Linha fina...';
    });
    $('f-corpo').addEventListener('input', (e) => {
      $('prevBody').innerHTML = esc(e.target.value).split(/\n{2,}/).map((p) => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
    });
    $('f-capa-url').addEventListener('input', (e) => { if (e.target.value) $('prevCover').src = e.target.value; });
    $('f-capa-file').addEventListener('change', (e) => {
      const f = e.target.files[0];
      if (f) $('prevCover').src = URL.createObjectURL(f);
    });

    function fieldErr(id, message) {
      const input = $(id);
      const err = input.closest('.field').querySelector('.err');
      const bad = message !== '';
      input.closest('.field').classList.toggle('invalid', bad);
      if (err) err.textContent = message;
      return !bad;
    }

    function coletar() {
      const v = {
        categoria: $('f-cat').value,
        slug: slugify($('f-slug').value),
        titulo: $('f-titulo').value.trim(),
        linha_fina: $('f-dek').value.trim(),
        capa_url: $('f-capa-url').value.trim(),
        capa_credito: $('f-credito').value.trim(),
        corpo: $('f-corpo').value.trim(),
        tags: $('f-tags').value.trim(),
        news_keywords: $('f-kw').value.trim()
      };
      let ok = true;
      ok = fieldErr('f-cat', v.categoria ? '' : 'Escolha a editoria.') && ok;
      ok = fieldErr('f-slug', v.slug.length >= 3 ? '' : 'Slug muito curto.') && ok;
      ok = fieldErr('f-titulo', v.titulo.length >= 10 ? '' : 'Título precisa de ao menos 10 caracteres.') && ok;
      ok = fieldErr('f-corpo', v.corpo.length >= 50 ? '' : 'Corpo muito curto (mín. 50 caracteres).') && ok;
      $('f-slug').value = v.slug;
      return ok ? v : null;
    }

    async function enviar(status, btn) {
      const v = coletar();
      if (!v) return;
      btn.disabled = true;
      const okBox = $('edOk');
      try {
        // 1. Upload da capa (se houver arquivo)
        const file = $('f-capa-file').files[0];
        if (file) {
          const ext = file.name.split('.').pop().toLowerCase();
          const path = `${autorId}/${Date.now()}.${ext}`;
          const { error: upErr } = await supabase.storage.from('capas').upload(path, file, { upsert: false });
          if (upErr) throw upErr;
          v.capa_url = supabase.storage.from('capas').getPublicUrl(path).data.publicUrl;
        }
        // 2. Slug único (sufixo incremental)
        let slug = v.slug, n = 2;
        for (;;) {
          const { data } = await supabase.from('noticias').select('id').eq('slug', slug).maybeSingle();
          if (!data) break;
          slug = `${v.slug}-${n++}`;
        }
        // 3. Insert
        const { error } = await supabase.from('noticias').insert({
          ...v, slug, status, autor_id: autorId, autor_nome: me.nome
        });
        if (error) throw error;
        okBox.hidden = false;
        okBox.innerHTML = status === 'publicada'
          ? `✅ <strong>Publicada!</strong> Ver em <a href="/noticias/${v.categoria}/${slug}" style="color:var(--gold)">/noticias/${v.categoria}/${slug}</a>`
          : `✅ <strong>Rascunho salvo</strong> (slug: ${slug}).`;
        if (status === 'publicada') document.getElementById('formMateria').reset();
      } catch (e) {
        okBox.hidden = false;
        okBox.style.borderColor = 'rgba(239,68,68,.5)';
        okBox.textContent = 'Erro: ' + e.message;
      }
      btn.disabled = false;
    }

    $('btnRascunho').addEventListener('click', (e) => enviar('rascunho', e.target));
    $('btnPublicar').addEventListener('click', (e) => enviar('publicada', e.target));
    document.getElementById('btnSair').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = '/login';
    });
  </script>
</body>
</html>
